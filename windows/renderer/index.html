<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:" />
  <title>Argo</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="sidebar">
    <div id="sidetools" class="toolbar"></div>
    <div id="workspaces"></div>
    <div class="side-foot">
      <div id="agents"></div>
      <div id="update"></div>
      <div class="row"><button id="settingsBtn" class="btn"></button><button id="phoneBtn" class="btn"></button></div>
    </div>
  </aside>
  <main>
    <header id="topbar"></header>
    <div id="runstrip"></div>
    <div id="subtasks"></div>
    <div id="banners"></div>
    <div id="stage"></div>
    <div id="approve"></div>
    <footer id="composer">
      <div id="attachments"></div>
      <div class="row">
        <div id="mode" class="seg"></div>
        <span class="chev">❯</span>
        <textarea id="prompt" rows="1" placeholder="Ask anything or describe a task…"></textarea>
        <button id="attach" class="icon" title="Attach files (or drop them here)"></button>
        <button id="send" title="Send (Enter)"></button>
      </div>
    </footer>
  </main>
  <aside id="right">
    <div id="rtabs"></div>
    <input id="filter" type="text" placeholder="Filter" spellcheck="false" hidden />
    <div id="rhead"></div>
    <div id="rbody"></div>
  </aside>
  <div id="modal" hidden></div>
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <!-- after xterm: with an AMD loader already on the page, xterm would register as a module instead of a global -->
  <script src="../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
